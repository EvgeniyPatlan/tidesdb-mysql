# Manual one-click "prepare and tag" workflow. Runs scripts/release-upstream-bump.sh
# end-to-end on a self-hosted runner: bumps version refs, rebuilds images,
# runs the four validation gates, writes the validation report and updates
# CHANGELOG / KNOWN-ISSUES, makes the two themed commits, pushes main, and
# pushes the tag. STOPS THERE. Any validation gate failing fails the job
# before any of the push steps.
#
# Docker Hub publishing and the GitHub release are deliberately NOT in this
# workflow — they're done manually on the workstation via
# scripts/release-docker.sh so Docker Hub credentials never leave your box.
# See .github/RELEASE_AUTOMATION.md for the full flow.
#
# Self-hosted runner is required because the validation gates (image builds +
# WARE=100 HammerDB throughput) need ~12 CPU / 32 GiB / hundreds of GB disk —
# more than a GitHub-hosted runner provides.

name: Release
on:
  workflow_dispatch:
    inputs:
      tidesdb_version:
        description: 'Engine tag (e.g. v9.4.0). Empty = latest upstream.'
        required: false
        type: string
      plugin_version:
        description: 'Plugin version (e.g. 0.3.2). Empty = auto-patch-bump.'
        required: false
        type: string
      skip_throughput:
        description: 'Skip the WARE=100 throughput gate (~30–40 min). Don''t skip for a real release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Label your self-hosted runner with at least these labels (see docs).
    runs-on: [self-hosted, linux, x64, tidesdb-release]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for tag operations
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sanity-check tools
        run: |
          for t in gh jq curl docker git; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::$t not on PATH on the runner"; exit 1; }
          done
          docker info >/dev/null

      - name: Run release-upstream-bump.sh
        env:
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          TIDESDB_VERSION:   ${{ github.event.inputs.tidesdb_version }}
          PLUGIN_VERSION:    ${{ github.event.inputs.plugin_version }}
          SKIP_THROUGHPUT:   ${{ github.event.inputs.skip_throughput == 'true' && '1' || '0' }}
          YES:               '1'
        run: ./scripts/release-upstream-bump.sh

      - name: Upload release artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: bench/results/release-*
          if-no-files-found: warn
          retention-days: 60

      - name: Next step (manual publish)
        if: success()
        run: |
          echo "::notice::Tag pushed. On the workstation run: ./scripts/release-docker.sh   to tag + push Docker Hub images and create the GitHub release."
