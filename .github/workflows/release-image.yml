name: release-image

# Build the runnable tidesdb/mysql:9.7 image and verify it works
# end-to-end. We deliberately do NOT push to any registry from CI --
# publishing is a manual step run locally via scripts/release-image.sh
# --push, so no Docker Hub (or other) credentials are stored in this
# repository's secrets.
#
# Triggers:
#   * push to main (sanity-check that the Dockerfile still builds and
#     the smoke test still passes)
#   * tag push:  vN.M.K
#   * manual workflow_dispatch
#
# What this proves:
#   - Stage 1 (Oracle Linux 9 + gcc-toolset-14) still compiles
#     ha_tidesdb.so against MySQL 9.7.0 from a cold checkout.
#   - Stage 2 layers the .so into mysql:9.7 cleanly.
#   - The freshly-built image passes docker/runtime/smoke-test.sh
#     (engine load + CRUD + composite PK + UNIQUE + persistence).

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    # Stage 1 of Dockerfile.mysql does a full MySQL 9.7.0 source build.
    # GHA runners disk-out around 90 min if Stage 1 is fully cold;
    # buildx with the GHA cache cuts subsequent runs to ~15 min.
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mysql
          # Build for the runner's native arch only -- the Stage 1
          # builder + plugin source have not been validated on arm64.
          platforms: linux/amd64
          # Push DISABLED on purpose. Publishing to Docker Hub is a
          # manual step from a developer machine.
          push: false
          # Load the built image into the local docker daemon so the
          # smoke-test step can run against it.
          load: true
          tags: tidesdb/mysql:ci
          # GitHub-Actions-native layer cache; first run populates,
          # later runs reuse Stage 1 (Oracle Linux deps + MySQL source
          # clone + convenience libs) and only recompile the plugin.
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke-test image
        shell: bash
        run: ./docker/runtime/smoke-test.sh tidesdb/mysql:ci

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Build & verify result"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Image **tidesdb/mysql:ci** built and smoke-tested."
              echo ""
              echo "To publish, run **locally** (no secrets needed in CI):"
              echo '```bash'
              echo "./scripts/release-image.sh <version> --push"
              echo '```'
            else
              echo "❌ Build or smoke-test failed -- see job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
